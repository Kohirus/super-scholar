name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check release discipline
        run: npm run check:release-discipline

      - name: Package
        run: npm run package

      - name: Generate release notes
        run: npm run release:notes

      - name: Generate Zotero update manifest
        run: npm run release:manifest

      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.package.outputs.tag }}"
          git push origin "${{ steps.package.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.package.outputs.tag }}"
          dist/package/*.xpi
          dist/package/updates.json
          --title "${{ steps.package.outputs.tag }}"
          --notes-file dist/package/release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: super-scholar-${{ steps.package.outputs.version }}
          path: |
            dist/package/*.xpi
            dist/package/updates.json
            dist/package/release-notes.md
          if-no-files-found: error
