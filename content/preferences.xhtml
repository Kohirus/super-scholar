<vbox
  id="zco-preferences"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <groupbox>
    <label><html:h2>super-scholar</html:h2></label>
    <description data-l10n-id="zco-pref-description"></description>

    <html:section class="zco-section">
      <html:h3 data-l10n-id="zco-pref-mineru-heading"></html:h3>
      <html:input
        id="zco-mineru-mode"
        type="hidden"
        preference="extensions.zotero-codex-obsidian.mineru.mode"
      />

      <html:div class="zco-tabs" role="tablist" data-l10n-id="zco-pref-mineru-mode">
        <html:button
          id="zco-mineru-local-tab"
          type="button"
          role="tab"
          data-zco-mineru-mode-tab="local"
          aria-controls="zco-mineru-local-settings"
          data-l10n-id="zco-pref-local-service"
        ></html:button>
        <html:button
          id="zco-mineru-cloud-tab"
          type="button"
          role="tab"
          data-zco-mineru-mode-tab="cloud"
          aria-controls="zco-mineru-cloud-settings"
          data-l10n-id="zco-pref-online-service"
        ></html:button>
      </html:div>

      <html:div id="zco-mineru-local-settings">
        <html:div class="zco-field">
          <html:label for="zco-mineru-local-api-base" data-l10n-id="zco-pref-local-api-label"></html:label>
          <html:input
            id="zco-mineru-local-api-base"
            type="text"
            preference="extensions.zotero-codex-obsidian.mineru.localApiBase"
            data-l10n-id="zco-pref-local-api-input"
          />
        </html:div>

        <html:div class="zco-field">
          <html:label for="zco-mineru-local-backend" data-l10n-id="zco-pref-local-backend"></html:label>
          <html:select
            id="zco-mineru-local-backend"
            preference="extensions.zotero-codex-obsidian.mineru.localBackend"
          >
            <html:option value="pipeline" data-l10n-id="zco-pref-backend-pipeline"></html:option>
            <html:option value="vlm" data-l10n-id="zco-pref-backend-vlm"></html:option>
            <html:option value="hybrid" data-l10n-id="zco-pref-backend-hybrid"></html:option>
          </html:select>
        </html:div>
      </html:div>

      <html:div id="zco-mineru-cloud-settings" hidden="true">
        <html:div class="zco-field">
          <html:label for="zco-mineru-cloud-api-base" data-l10n-id="zco-pref-cloud-api-label"></html:label>
          <html:input
            id="zco-mineru-cloud-api-base"
            type="text"
            preference="extensions.zotero-codex-obsidian.mineru.cloudApiBase"
            data-l10n-id="zco-pref-cloud-api-input"
          />
        </html:div>

        <html:div class="zco-field">
          <html:label for="zco-mineru-cloud-api-key" data-l10n-id="zco-pref-cloud-api-key"></html:label>
          <html:input
            id="zco-mineru-cloud-api-key"
            type="password"
            preference="extensions.zotero-codex-obsidian.mineru.cloudApiKey"
          />
        </html:div>

        <html:div class="zco-field">
          <html:label for="zco-mineru-cloud-model" data-l10n-id="zco-pref-cloud-model"></html:label>
          <html:select
            id="zco-mineru-cloud-model"
            preference="extensions.zotero-codex-obsidian.mineru.cloudModel"
          >
            <html:option value="auto" data-l10n-id="zco-pref-model-auto"></html:option>
            <html:option value="ocr" data-l10n-id="zco-pref-model-ocr"></html:option>
            <html:option value="txt" data-l10n-id="zco-pref-model-txt"></html:option>
          </html:select>
        </html:div>
      </html:div>

      <html:div class="zco-field zco-inline">
        <html:input
          id="zco-mineru-force-ocr"
          type="checkbox"
          preference="extensions.zotero-codex-obsidian.mineru.forceOcr"
        />
        <html:label for="zco-mineru-force-ocr" data-l10n-id="zco-pref-force-ocr"></html:label>
      </html:div>

      <html:div class="zco-actions">
        <html:button id="zco-test-mineru" type="button" data-l10n-id="zco-pref-test-mineru"></html:button>
        <html:span id="zco-test-status"></html:span>
      </html:div>
    </html:section>

    <html:section class="zco-section">
      <html:h3 data-l10n-id="zco-pref-obsidian-heading"></html:h3>
      <html:div class="zco-field">
        <html:label for="zco-obsidian-notes-dir" data-l10n-id="zco-pref-notes-dir"></html:label>
        <html:input
          id="zco-obsidian-notes-dir"
          type="text"
          preference="extensions.zotero-codex-obsidian.obsidian.notesDir"
          data-l10n-id="zco-pref-notes-dir-input"
        />
      </html:div>
    </html:section>

    <html:section class="zco-section">
      <html:h3 data-l10n-id="zco-pref-pdf-filter-heading"></html:h3>
      <html:div class="zco-field">
        <html:label for="zco-pdf-exclude-filename-glob" data-l10n-id="zco-pref-pdf-filter-label"></html:label>
        <html:input
          id="zco-pdf-exclude-filename-glob"
          type="text"
          preference="extensions.zotero-codex-obsidian.pdf.excludeFilenameGlob"
          data-l10n-id="zco-pref-pdf-filter-input"
        />
        <html:small data-l10n-id="zco-pref-pdf-filter-help"></html:small>
      </html:div>
    </html:section>
  </groupbox>
</vbox>
